# Like config/samples/policy.yaml, but limited to ConfigMaps. The token is
# read from the chart's Secret (see kyverno-rbac.yaml). The proxy is called
# over plain HTTP because Kyverno's http.Client(caBundle) is broken, see
# test/README.md.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: check-cluster-bound-to-apiexport
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [configmaps]
  matchConditions:
    - name: has-cluster-annotation
      expression: "has(object.metadata.annotations) && 'kcp.io/cluster' in object.metadata.annotations"
  variables:
    - name: cluster
      expression: "object.metadata.?annotations[?'kcp.io/cluster'].orValue('')"
    - name: token
      expression: >-
        string(base64.decode(resource.Get('v1', 'secrets', 'kcp-apiexport-proxy',
          'kcp-apiexport-proxy-token').data.token))
    - name: apiBindings
      expression: >-
        http.Get(
          'http://kcp-apiexport-proxy.kcp-apiexport-proxy.svc:8080/apiexportendpointslices/example.com/clusters/'
            + variables.cluster + '/apis/apis.kcp.io/v1alpha1/apibindings',
          {'Authorization': 'Bearer ' + variables.token})
  validations:
    - expression: "has(variables.apiBindings.items) && variables.apiBindings.items.size() > 0"
      message: >-
        Logical cluster referenced by the "kcp.io/cluster" annotation has no
        APIBindings for this APIExport.
