# Like config/samples/policy.yaml, but limited to ConfigMaps and pointing at
# the proxy deployed by proxy.yaml.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: check-cluster-bound-to-apiexport
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [configmaps]
  matchConditions:
    - name: has-cluster-annotation
      expression: "has(object.metadata.annotations) && 'kcp.io/cluster' in object.metadata.annotations"
  variables:
    - name: cluster
      expression: "object.metadata.?annotations[?'kcp.io/cluster'].orValue('')"
    - name: apiBindings
      expression: >-
        http.Get('http://kcp-apiexport-proxy.kcp-apiexport-proxy.svc.cluster.local:8080/clusters/'
          + variables.cluster + '/apis/apis.kcp.io/v1alpha1/apibindings')
  validations:
    - expression: "has(variables.apiBindings.items) && variables.apiBindings.items.size() > 0"
      message: >-
        Logical cluster referenced by the "kcp.io/cluster" annotation has no
        APIBindings for this APIExport.
