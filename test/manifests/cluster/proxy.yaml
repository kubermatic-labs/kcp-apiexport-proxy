# The proxy, using the kubeconfig from the kcp-apiexport-proxy-kubeconfig
# Secret, which the test script creates.
apiVersion: v1
kind: Namespace
metadata:
  name: kcp-apiexport-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: kcp-apiexport-proxy
  namespace: kcp-apiexport-proxy
spec:
  selector:
    app: kcp-apiexport-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcp-apiexport-proxy
  namespace: kcp-apiexport-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kcp-apiexport-proxy
  template:
    metadata:
      labels:
        app: kcp-apiexport-proxy
    spec:
      containers:
        - name: proxy
          image: kcp-apiexport-proxy:test
          imagePullPolicy: Never
          args:
            - --kubeconfig=/etc/kcp-apiexport-proxy/kubeconfig
            - --apiexportendpointslice-names=example.com
            - --bind-address=:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kcp-apiexport-proxy
              readOnly: true
      volumes:
        - name: kubeconfig
          secret:
            secretName: kcp-apiexport-proxy-kubeconfig
