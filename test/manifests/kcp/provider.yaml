# Applied in the root:provider workspace. kcp creates an
# APIExportEndpointSlice named after the APIExport, which the proxy watches.
apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1.widgets.example.com
spec:
  group: example.com
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: example.com
spec:
  resources:
    - group: example.com
      name: widgets
      schema: v1.widgets.example.com
      storage:
        crd: {}
