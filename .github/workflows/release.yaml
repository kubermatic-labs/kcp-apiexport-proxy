name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: GOOS=linux GOARCH=amd64 make build
      - run: |
          docker build \
            --platform linux/amd64 \
            --file build/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$VERSION" \
            _output
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - run: docker push "$IMAGE:$VERSION"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            _output/kcp-apiexport-proxy-"$VERSION"-linux-amd64.tar.gz \
            _output/kcp-apiexport-proxy-"$VERSION"-linux-amd64.tar.gz.sha256 \
            _output/kcp-apiexport-proxy-"$VERSION"-helm-chart.tar.gz \
            _output/kcp-apiexport-proxy-"$VERSION"-helm-chart.tar.gz.sha256
