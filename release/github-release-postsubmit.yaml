postsubmits:
  kubermatic-labs/kcp-apiexport-proxy:
    - name: post-kcp-apiexport-proxy-github-release
      max_concurrency: 1
      cluster: ci-controlplane
      decorate: true
      clone_uri: "ssh://git@github.com/kubermatic-labs/kcp-apiexport-proxy.git"
      branches:
        - ^v\d+\.\d+\.\d+.*
      labels:
        preset-goproxy: "true"
        preset-kubermatic-bot-token: "true"
      spec:
        containers:
          - image: quay.io/kubermatic/build:go-1.26-node-22-kind-0.32-13
            command:
              - "./release/github-release.sh"
            resources:
              requests:
                cpu: 2
                memory: 2Gi
