{{- if and .Values.token.enabled (not .Values.token.existingSecret) }}
{{- $name := include "kcp-apiexport-proxy.tokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := randAlphaNum 48 | b64enc }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.token.key) }}
{{- $token = index $existing.data .Values.token.key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcp-apiexport-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.token.key }}: {{ $token }}
{{- end }}
