{{- if .Values.tls.enabled }}
{{- $fullname := include "kcp-apiexport-proxy.fullname" . }}
{{- $issuerRef := .Values.tls.issuerRef }}
{{- if not $issuerRef.name }}
{{- $issuerRef = dict "name" (printf "%s-ca" $fullname) "kind" "Issuer" }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcp-apiexport-proxy.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcp-apiexport-proxy.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ $fullname }}-ca
  secretName: {{ $fullname }}-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ $fullname }}-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcp-apiexport-proxy.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $fullname }}-ca
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kcp-apiexport-proxy.labels" . | nindent 4 }}
spec:
  secretName: {{ include "kcp-apiexport-proxy.tlsSecretName" . }}
  dnsNames:
    - {{ $fullname }}
    - {{ $fullname }}.{{ .Release.Namespace }}
    - {{ $fullname }}.{{ .Release.Namespace }}.svc
    - {{ $fullname }}.{{ .Release.Namespace }}.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    {{- toYaml $issuerRef | nindent 4 }}
{{- end }}
