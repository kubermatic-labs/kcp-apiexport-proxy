image:
  repository: ghcr.io/kubermatic-labs/kcp-apiexport-proxy
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 2

# Names of the APIExportEndpointSlices to proxy, all in the workspace the
# kubeconfig points at. Required.
apiExportEndpointSliceNames: []

kubeconfig:
  # Name of an existing Secret holding the kubeconfig for kcp. Its current
  # context must point at the workspace containing the
  # APIExportEndpointSlices, and its identity is used for all requests to
  # kcp. Required.
  secretName: ""
  key: kubeconfig

token:
  # Require clients to send "Authorization: Bearer <token>". Without TLS the
  # token is sent in plain text.
  enabled: true
  # Name of an existing Secret holding the token. If empty, the chart
  # generates a random token into the Secret "<fullname>-token" and keeps it
  # across upgrades.
  existingSecret: ""
  key: token

tls:
  # Serve HTTPS with a certificate from cert-manager, which must be
  # installed. Disabled by default because Kyverno can't use a custom CA yet,
  # see test/README.md.
  enabled: false
  # cert-manager issuer for the serving certificate, e.g.
  # {name: my-issuer, kind: ClusterIssuer}. If empty, the chart creates a
  # self-signed CA. Either way the certificate and its CA end up in the
  # Secret "<fullname>-tls" (tls.crt, tls.key, ca.crt).
  issuerRef: {}

service:
  type: ClusterIP
  port: 8080

extraArgs: []

podAnnotations: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
