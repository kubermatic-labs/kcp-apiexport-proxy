postsubmits:
  - name: post-kcp-apiexport-proxy-push-image
    max_concurrency: 1
    decorate: true
    clone_uri: "ssh://git@github.com/kubermatic-labs/kcp-apiexport-proxy.git"
    branches:
      - ^v\d+\.\d+\.\d+.*
    labels:
      preset-goproxy: "true"
      preset-docker-mirror: "true"
      preset-docker-push-labs: "true"
    spec:
      containers:
        - image: quay.io/kubermatic/build:go-1.26-node-22-kind-0.32-13
          command:
            - ./release/push-image.sh
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 2
              memory: 2Gi
