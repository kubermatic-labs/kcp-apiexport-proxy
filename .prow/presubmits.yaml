presubmits:
  - name: pull-kcp-apiexport-proxy-build
    always_run: true
    decorate: true
    clone_uri: "ssh://git@github.com/kubermatic-labs/kcp-apiexport-proxy.git"
    labels:
      preset-goproxy: "true"
    spec:
      containers:
        - image: quay.io/kubermatic/build:go-1.26-node-22-kind-0.32-13
          command:
            - make
            - build
          resources:
            requests:
              cpu: 2
              memory: 2Gi

  - name: pull-kcp-apiexport-proxy-test
    always_run: true
    decorate: true
    clone_uri: "ssh://git@github.com/kubermatic-labs/kcp-apiexport-proxy.git"
    labels:
      preset-goproxy: "true"
    spec:
      containers:
        - image: quay.io/kubermatic/build:go-1.26-node-22-kind-0.32-13
          command:
            - make
            - test
          resources:
            requests:
              cpu: 2
              memory: 2Gi

  - name: pull-kcp-apiexport-proxy-verify
    always_run: true
    decorate: true
    clone_uri: "ssh://git@github.com/kubermatic-labs/kcp-apiexport-proxy.git"
    labels:
      preset-goproxy: "true"
    spec:
      containers:
        - image: quay.io/kubermatic/build:go-1.26-node-22-kind-0.32-13
          command:
            - make
            - verify
          resources:
            requests:
              cpu: 2
              memory: 4Gi

  - name: pull-kcp-apiexport-proxy-test-integration
    always_run: true
    decorate: true
    clone_uri: "ssh://git@github.com/kubermatic-labs/kcp-apiexport-proxy.git"
    labels:
      preset-goproxy: "true"
      preset-docker-mirror: "true"
      preset-kind-volume-mounts: "true"
    spec:
      containers:
        - image: quay.io/kubermatic/build:go-1.26-node-22-kind-0.32-13
          command:
            - make
            - test-integration
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 4
              memory: 6Gi
